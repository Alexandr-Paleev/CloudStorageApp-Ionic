version: 2

updates:
  # Security patches matter more here than staying on the newest minor: this
  # project handles payment webhooks, storage credentials and OAuth tokens.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Above the number of groups below, and it has to stay there. The limit
    # counts pull requests, a group is one, and the groups are opened first.
    # At 5, with eight groups, an update outside them got a slot only in a
    # week when fewer than five groups had something, and the rest were not
    # queued: they were dropped, to lose to the same groups the next Monday.
    # On 2026-10-19 the run found five groups and seventeen single updates
    # and opened the five. vite 8.3, out since 2026-09-10, was never
    # proposed, and three advisories against vite 8.2.2 then found no pull
    # request to carry the fix. Every update is in a group now, so a run
    # opens at most one pull request per group, and all of them fit.
    open-pull-requests-limit: 15
    groups:
      # One PR per family instead of a dozen: @aws-sdk alone ships three
      # packages that must move together.
      aws-sdk:
        patterns: ['@aws-sdk/*']
      sentry:
        patterns: ['@sentry/*']
      ionic:
        patterns: ['@ionic/*', 'ionicons']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']
      # React does not start unless react and react-dom are the same version.
      # An update that moved one without the other built an app that rendered
      # nothing; the smoke test and the end-to-end suite both said so, and the
      # pull request could only be closed. These two have types of their own,
      # and the types stay here rather than in `types`: a dependency joins the
      # most specific group that matches it ("belongs to more specific group
      # 'react'", in Dependabot's own log).
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      types:
        patterns: ['@types/*']
      # Nx wants its own packages on one version, and there will be more of
      # them than `nx` once the workspace has a second project.
      nx:
        patterns: ['nx', '@nx/*']
      # Next and the lint plugin that knows its rules are released together.
      next:
        patterns: ['next', '@next/*']
      # Core, cli and the two platforms are released together, and
      # `npx cap sync` writes every plugin into both native projects. Six of
      # the seventeen updates dropped on 2026-10-19 were these.
      capacitor:
        patterns: ['@capacitor/*']
      # What turns the source into the bundle. A change here can move every
      # chunk, so it comes on its own, to be measured with `npm run size` and
      # `npm run smoke` rather than merged with whatever else was due.
      build:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-pwa', 'workbox-*']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint', 'globals']
      # Everything no family above claims, split by where it runs. `*` is the
      # least specific pattern there is, so a dependency that a group above
      # names stays in that group.
      runtime:
        dependency-type: production
        patterns: ['*']
      tooling:
        dependency-type: development
        patterns: ['*']
    ignore:
      # Majors are migrations, not updates: they need a changelog read and a
      # decision, which is exactly what an automated PR cannot supply. The
      # first Dependabot run proposed seven of them at once — Capacitor 6 to 8,
      # Ionic 8 to 9, TypeScript 5 to 7, react-router 6 to 7, ESLint 8 to 10 —
      # two failing CI outright. Minor and patch still arrive weekly.
      #
      # The sentence that used to end this comment — "which is where security
      # fixes land" — was wrong, and worth leaving a marker where it stood.
      # Sometimes the fix is only in the next major, and then this rule means
      # nobody is told at all: four high-severity undici advisories reached
      # production dependencies through @vercel/node and sat there with every
      # check green. The backstop is now `npm audit --omit=dev
      # --audit-level=high` in CI, which fails the build rather than waiting
      # for a pull request that this rule will never allow.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

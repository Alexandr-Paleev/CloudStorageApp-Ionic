version: 2

updates:
  # Security patches matter more here than staying on the newest minor: this
  # project handles payment webhooks, storage credentials and OAuth tokens.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per family instead of a dozen: @aws-sdk alone ships three
      # packages that must move together.
      aws-sdk:
        patterns: ['@aws-sdk/*']
      sentry:
        patterns: ['@sentry/*']
      ionic:
        patterns: ['@ionic/*', 'ionicons']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']
      types:
        patterns: ['@types/*']
    ignore:
      # Major bumps here are platform migrations, not dependency updates:
      # Capacitor 6 -> 8 moves the native toolchain, Ionic 8 -> 9 is a UI
      # framework rewrite that e2e smoke tests would not catch, and @types/node
      # must track the Node version CI actually runs (22).
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@ionic/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

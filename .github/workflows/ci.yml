name: CI

# Every push is checked, not only pushes to main: a branch waiting for its
# pull request to be opened was previously not verified at all.
on:
  push:
  # Opening the PR would otherwise re-run what the push already covered. Forks
  # still need this trigger — their pushes cannot run against this repository.
  pull_request:
    types: [opened, reopened]

# A new push supersedes the run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The dependency policy ignores majors — see .github/dependabot.yml, where
      # the reasoning still holds. What it did not account for is that a security
      # fix can land behind a major, and then nothing opens a pull request at
      # all: four high-severity undici advisories sat in this repository for
      # months, reachable only through @vercel/node, with every check green.
      #
      # --omit=dev on purpose. A vulnerability in a build tool is not a
      # vulnerability in what the browser downloads or what the functions run,
      # and failing the build over one trains people to ignore the step.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      # src/env.ts validates import.meta.env with Zod on startup, so the build
      # needs the two required variables present. Real values come from repo
      # secrets when they are set; the placeholders only have to satisfy Zod.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          EOF

      # Type-checks src (tsconfig.build.json) and api (tsconfig.api.json), then builds.
      - run: npm run build

      # A byte count rather than a score, so it cannot be flaky: the check fails
      # when what the browser fetches before first paint grows past its budget.
      # scripts/check-bundle-size.js holds the numbers and why each one is what
      # it is, and prints the table onto the run page either way.
      - name: Bundle size
        run: npm run --silent size | tee -a "$GITHUB_STEP_SUMMARY"

      # The one check that runs the built bundle rather than the source.
      # `npm run dev` serves unbundled modules, so manualChunks in
      # vite.config.ts is inert there and the Playwright suite — which runs
      # against that dev server — cannot see it. A chunk split that puts
      # react-dom and React in different chunks paints nothing, and every
      # other step here stays green while it does.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the built bundle
        run: npm run --silent smoke

      - run: npm run test:coverage

      # Puts the numbers on the run page, so a pull request shows what its
      # tests actually reach without anyone opening an artifact.
      #
      # Two tables rather than one: the handlers and the React layer are
      # covered by different suites in different runtimes, and a single
      # blended percentage would hide which of the two moved.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      # The other half: what happens once the bytes have arrived — render
      # blocking, layout shift, contrast, metadata. Audits dist/ directly
      # rather than a preview deployment; lighthouserc.js says why, and holds
      # the thresholds.
      #
      # lhci is run through npx rather than added to devDependencies: it brings
      # Lighthouse and its Chrome tooling, some 40 MB installed, for a check
      # that runs here and occasionally on a laptop.
      - name: Lighthouse
        run: npm run --silent lighthouse

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # auth, routing and legal specs are pure UI and pass on placeholders.
      # billing-entry.spec.ts provisions a throwaway user through the Supabase
      # admin API and skips itself unless all four values below are real, so
      # without the optional secrets it reports as skipped rather than failing.
      #
      # demo.spec.ts additionally needs DEMO_ENABLED, and deletes the account it
      # opens rather than leaving it for the endpoint's 24-hour sweep — this
      # runs on every push, against a real project.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          VITE_BILLING_ENABLED=true
          VITE_DEMO_ENABLED=true
          DEMO_ENABLED=true
          EOF

      - run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

[project]
name = "search-evals"
version = "0.1.0"
description = "How often search by meaning finds the file a person means"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]

[project.scripts]
search-evals = "search_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Nothing published in the two weeks before the lock was last made. A release
# that turns out to be malicious is usually pulled within days; moving this
# date is how the dependencies are updated, on purpose and in one diff.
exclude-newer = "2026-10-16T00:00:00Z"

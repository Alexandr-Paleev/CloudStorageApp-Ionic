<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192x192-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links. Ionic React, TypeScript and Supabase."
    />
    <meta name="theme-color" content="#3880ff" />

    <!-- Inter, without the round trip an @import inside CSS costs.
         It used to live at the top of theme/variables.css, which meant the
         browser had to download and parse that stylesheet before it learned a
         font was needed at all — three sequential requests before any text
         could be painted. Declared here, the preconnect opens the connection
         while the bundle is still downloading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192x192-v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cloud Storage" />

    <!-- Link previews. Absolute URLs on purpose: every crawler resolves og:image
         against nothing, so a relative path renders as a blank card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloud Storage App" />
    <meta property="og:title" content="Cloud Storage App" />
    <meta
      property="og:description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links. Ionic React, TypeScript and Supabase."
    />
    <meta property="og:url" content="https://cloud-storage-app-ionic-v0.vercel.app/" />
    <meta
      property="og:image"
      content="https://cloud-storage-app-ionic-v0.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cloud Storage App — the dashboard, showing the storage meter and a list of files"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloud Storage App" />
    <meta
      name="twitter:description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links."
    />
    <meta
      name="twitter:image"
      content="https://cloud-storage-app-ionic-v0.vercel.app/og-image.png"
    />

    <title>Cloud Storage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

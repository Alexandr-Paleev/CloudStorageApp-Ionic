<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192x192-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links. Ionic React, TypeScript and Supabase."
    />
    <meta name="theme-color" content="#3880ff" />

    <!-- Inter's Latin subset, the one every screen of the app needs. The font
         is served by the app itself (theme/fonts.css), and a font is found
         only once the stylesheet that names it has been parsed: preloaded, it
         downloads beside the bundle instead of after it. crossorigin, or the
         preload is not the request the stylesheet makes and is fetched twice. -->
    <link
      rel="preload"
      href="/fonts/inter-v20-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192x192-v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cloud Storage" />

    <!-- Link previews. Absolute URLs on purpose: every crawler resolves og:image
         against nothing, so a relative path renders as a blank card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloud Storage App" />
    <meta property="og:title" content="Cloud Storage App" />
    <meta
      property="og:description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links. Ionic React, TypeScript and Supabase."
    />
    <meta property="og:url" content="https://cloud-storage-app-ionic-v0.vercel.app/" />
    <meta
      property="og:image"
      content="https://cloud-storage-app-ionic-v0.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cloud Storage App — the dashboard, showing the storage meter and a list of files"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloud Storage App" />
    <meta
      name="twitter:description"
      content="Open-source cloud storage PWA: five storage backends, Stripe billing, expiring share links."
    />
    <meta
      name="twitter:image"
      content="https://cloud-storage-app-ionic-v0.vercel.app/og-image.png"
    />

    <title>Cloud Storage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
